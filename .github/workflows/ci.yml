name: Workbench
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:attribution
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: node scripts/check-secrets.mjs
      - run: npm run build
      - run: npx playwright install chromium
        timeout-minutes: 3
      - run: npm run test:e2e
      - name: Audit the live site on Linux
        run: node scripts/quality-audit.mjs
        env:
          LIVE_URL: https://brej-29.github.io/fraud-anomaly-lab/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-quality
          path: reports/lighthouse-live-ci.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-diagnostics
          path: test-results/
          retention-days: 3
