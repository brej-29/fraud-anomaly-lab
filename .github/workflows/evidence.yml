name: Evidence
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r backend/requirements.txt -r ml/requirements.txt -r evaluation/requirements.txt ruff
      - run: ruff check backend ml shared
      - run: python -m pytest backend ml evaluation -q --tb=short
